# Input types for bulk import mutations
#
# `ItemInput` is the global item CONFIGURATION only. The five per-location state
# fields — targetQuantity, refillThreshold, packedQuantity, unpackedQuantity,
# dueDate — are NOT here: cloud locations PR 5 dropped them from `Item`, and an
# imported payload's stock rows travel in `ItemStockImportInput` through
# `bulkCreateItemStocks` / `bulkUpsertItemStocks`, each row naming its location.
input ItemInput {
  id: ID!
  name: String!
  # Both optional, and both must be here or a cloud backup silently drops them
  # on restore (issue #335).
  wikidataUrl: String
  note: String
  tagIds: [String!]!
  vendorIds: [String!]
  packageUnit: String
  measurementUnit: String
  amountPerPackage: Float
  targetUnit: String!
  consumeAmount: Float!
  estimatedDueDays: Int
  expirationThreshold: Int
  expirationMode: String
  createdAt: String!
  updatedAt: String!
}

input TagInput {
  id: ID!
  name: String!
  typeId: String!
  parentId: String
}

input TagTypeInput {
  id: ID!
  name: String!
  color: String!
}

input VendorInput {
  id: ID!
  name: String!
}

input RecipeInput {
  id: ID!
  name: String!
  items: [RecipeItemInput!]!
  lastCookedAt: String
}

input InventoryLogInput {
  id: ID!
  itemId: ID!
  delta: Float!
  quantity: Float!
  occurredAt: String!
  note: String
  logKey: String
  logParams: JSON
  # OPTIONAL, not `ID!`, on purpose. A client built before cloud locations
  # sends no such field, and making it required would reject every import
  # that client issues. When it is absent the resolver falls back to the
  # caller's first location they may write to (`fallbackImportLocation`,
  # lib/authz.ts, households decision H12).
  #
  # Attacker-controlled. The resolvers verify it through
  # `requireLocationRole(ctx, locationId, 'participant')` before any row is
  # written — a log in someone else's location would be a cross-user write.
  locationId: ID
}

input ShoppingCartInput {
  id: ID!
  lastPurchasedAt: String
}

input CartItemInput {
  id: ID!
  cartId: ID!
  itemId: ID!
  quantity: Int!
}

input LocationInput {
  id: ID!
  name: String!
  order: Int!
  createdAt: String!
  updatedAt: String!
  # No `isDefault` field. Cloud locations have had no `isDefault` column since
  # households H3a task 3.14 (the drop_user_scope migration). A cloud backup's
  # first location is the one with the lowest `order`.
}

# One ItemStock row from a backup: the per-(item x location) stock STATE.
#
# WHY THIS IS A SECOND INPUT AND NOT `ItemStockInput` (schema/itemStock.graphql:78).
# The next reader will want to merge the two. They cannot be merged:
#
#  1. `ItemStockInput` is a PARTIAL-MERGE input. All five of its fields are
#     optional and a MISSING key means "leave that column alone" — see `toData`
#     in itemStock.resolver.ts. Import is a REPLACE: every column comes from
#     the payload, so every field here is required. One input cannot mean both.
#  2. `ItemStockInput` carries no identity at all. `upsertItemStock` takes
#     `itemId` and `locationId` as its own arguments; a bulk payload has to
#     carry `id`, `itemId` and `locationId` per row.
#  3. Widening `ItemStockInput` would change a THIRD contract.
#     `UnitSwitchStockConversionInput` (itemStock.graphql:51) embeds it as
#     `quantities`, so new required fields there would break `applyUnitSwitch`.
#  4. Renaming `ItemStockInput` to free the clean name is also out: input type
#     names appear in client operations
#     (`mutation UpsertItemStock($input: ItemStockInput!)`), so a rename breaks
#     a cached bundle still running the old document.
#
# NO `userId` FIELD, and the resolvers write none. `ItemStock` has no `userId`
# COLUMN, on purpose: it is scoped THROUGH its location (root CLAUDE.md,
# Authorization). The field list below is every column of the Prisma model
# (schema.prisma:267-284) and every field of the local `ItemStock` interface
# (packages/types/src/index.ts:47), with nothing added and nothing dropped.
input ItemStockImportInput {
  id: ID!
  itemId: ID!
  locationId: ID!
  targetQuantity: Float!
  refillThreshold: Float!
  packedQuantity: Float!
  unpackedQuantity: Float!
  dueDate: String
  createdAt: String!
  updatedAt: String!
}

input ShelfInput {
  id: ID!
  name: String!
  type: String!
  order: Int!
  filterConfig: FilterConfigInput
  itemIds: [String!]
  createdAt: String!
  updatedAt: String!
}

extend type Mutation {
  # Bulk create mutations — used for "skip conflicts" strategy
  bulkCreateItems(items: [ItemInput!]!): [Item!]!
  bulkCreateTags(tags: [TagInput!]!): [Tag!]!
  bulkCreateTagTypes(tagTypes: [TagTypeInput!]!): [TagType!]!
  bulkCreateVendors(vendors: [VendorInput!]!): [Vendor!]!
  bulkCreateRecipes(recipes: [RecipeInput!]!): [Recipe!]!
  bulkCreateInventoryLogs(logs: [InventoryLogInput!]!): [InventoryLog!]!
  bulkCreateShoppingCarts(carts: [ShoppingCartInput!]!): [Cart!]!
  bulkCreateCartItems(cartItems: [CartItemInput!]!): [CartItem!]!
  bulkCreateShelves(shelves: [ShelfInput!]!): [Shelf!]!
  bulkCreateLocations(locations: [LocationInput!]!): [Location!]!
  bulkCreateItemStocks(itemStocks: [ItemStockImportInput!]!): [ItemStock!]!

  # Bulk upsert mutations — used for "replace conflicts" strategy (upserts by entity id)
  bulkUpsertItems(items: [ItemInput!]!): [Item!]!
  bulkUpsertTags(tags: [TagInput!]!): [Tag!]!
  bulkUpsertTagTypes(tagTypes: [TagTypeInput!]!): [TagType!]!
  bulkUpsertVendors(vendors: [VendorInput!]!): [Vendor!]!
  bulkUpsertRecipes(recipes: [RecipeInput!]!): [Recipe!]!
  bulkUpsertInventoryLogs(logs: [InventoryLogInput!]!): [InventoryLog!]!
  bulkUpsertShoppingCarts(carts: [ShoppingCartInput!]!): [Cart!]!
  bulkUpsertCartItems(cartItems: [CartItemInput!]!): [CartItem!]!
  bulkUpsertShelves(shelves: [ShelfInput!]!): [Shelf!]!
  bulkUpsertLocations(locations: [LocationInput!]!): [Location!]!
  bulkUpsertItemStocks(itemStocks: [ItemStockImportInput!]!): [ItemStock!]!

  # Clear the caller's household — used for the "clear & import" strategy.
  # Household role `owner` only. Deletes the catalog and every location, with
  # everything in them, and keeps the household and its members. Then makes
  # one new location, "Home", with the caller as organizer, in the same
  # transaction (households H3a task 3.10, decision H17).
  clearAllData: Boolean!
}
