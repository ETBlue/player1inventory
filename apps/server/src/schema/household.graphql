# The caller's household (households H3a, task 3.13).

# The three household roles (decision H14). `owner` > `manager` > `member`.
enum HouseholdRole {
  owner
  manager
  member
}

type Household {
  id: ID!
  # Set by the owner. First sign-in names it "<display name>'s Household"
  # in the app language (decision H3).
  name: String!
  # The CALLER's role in this household, not a property of the household.
  role: HouseholdRole!
}

extend type Query {
  # The caller's household. A new person gets their household, and its first
  # location, on their first call (first sign-in, lib/household.ts).
  household: Household!
}

extend type Mutation {
  # Household role `owner` (decision H4). The name is trimmed. An empty or
  # blank name, or one longer than 100 characters, is refused with the error
  # code BAD_USER_INPUT.
  renameHousehold(name: String!): Household!
}

# ── Invites (households H5b, task G.3) ──

# What `invitePreview` found for a token. One answer, INVALID, for a token
# that is unknown, used, revoked or expired (decision T18), so a caller learns
# nothing about a token.
enum InviteStatus {
  VALID
  ALREADY_MEMBER
  INVALID
}

# One location role an invite gives.
type InviteLocationRole {
  locationId: ID!
  locationName: String!
  role: LocationRole!
}

# An open invite: not used, not revoked, not expired.
type HouseholdInvite {
  id: ID!
  # The secret part of the link. Only the owner and a manager ever get it:
  # from `createInvite`, which they made, and from `householdInvites`, so they
  # can copy an open link again (owner decision O7-A). `invitePreview` never
  # returns it.
  token: String!
  householdRole: HouseholdRole!
  # Only the locations that still exist in the household. An invite whose
  # every location was deleted since (for example by clearAllData) has an
  # empty list.
  locationRoles: [InviteLocationRole!]!
  createdByName: String!
  expiresAt: String!
}

# What a person sees before they join (the join page).
type InvitePreview {
  status: InviteStatus!
  # All four are null when status is INVALID.
  householdName: String
  invitedByName: String
  householdRole: HouseholdRole
  locationRoles: [InviteLocationRole!]
}

input InviteLocationRoleInput {
  locationId: ID!
  role: LocationRole!
}

extend type Query {
  # The open invites of the caller's household, oldest first. Household role
  # `manager` or higher. A manager sees only `member` invites (owner
  # decisions O13-A, O15-A).
  householdInvites: [HouseholdInvite!]!
  # Any signed-in person, also one in no household (decision T22). It never
  # throws for a token: it answers with a status. It holds no token.
  invitePreview(token: String!): InvitePreview!
}

extend type Mutation {
  # Household role `manager` or higher. Only the owner may invite a
  # `manager`; nobody may invite an `owner` (BAD_USER_INPUT). Every location
  # must be in the caller's household (FORBIDDEN otherwise); a location named
  # twice is BAD_USER_INPUT. The list may be empty (owner decision O14-A).
  # The link works once, for 7 days.
  createInvite(
    householdRole: HouseholdRole!
    locationRoles: [InviteLocationRoleInput!]!
  ): HouseholdInvite!
  # Household role `manager` or higher. The owner revokes any open invite of
  # the household; a manager only a `member` invite (owner decision O15-A).
  # `false` when nothing was revoked: an unknown id, another household's
  # invite, one already used or revoked, or a manager invite for a manager.
  revokeInvite(id: ID!): Boolean!
}

extend type Mutation {
  # Join the household of this invite (households H5b, task G.4). Any
  # signed-in person, also one in no household (decision T22). The caller
  # becomes a member with the invite's household role and the invite's
  # location roles, on the locations that still exist. The joined household
  # becomes the one they act in. Their own household is deleted when it holds
  # no data and nobody else (owner decision O2-A); otherwise it is kept.
  # Refused with BAD_USER_INPUT and extensions.reason INVITE_INVALID (unknown,
  # used, revoked or expired: one answer for all four) or ALREADY_MEMBER (the
  # link stays unused).
  joinHousehold(token: String!): Household!
}

# ── Members, roles, leaving and creating (households H5b, task G.5) ──

# One person of the caller's household. Named `HouseholdPerson`, not
# `HouseholdMember`, so it is not mixed up with the Prisma model in generated
# code. It has no e-mail address, on purpose: every member reads this list
# (owner decision O13-A).
type HouseholdPerson {
  userId: ID!
  displayName: String!
  role: HouseholdRole!
  joinedAt: String!
  # True only on the caller's own row.
  isMe: Boolean!
  # True when the person has a role on at least one location of THIS
  # household (households H5c, decision T40, owner decision O28-A). It does
  # not say which location. Roles in another household do not count. The
  # Members page shows "No location roles" when it is false.
  hasLocationRole: Boolean!
}

extend type Query {
  # Every person of the caller's household, for any household role (owner
  # decision O13-A). The owner first, then by `joinedAt`, then by `userId`.
  householdMembers: [HouseholdPerson!]!
}

extend type Mutation {
  # Household role `owner`. Changes another person between `member` and
  # `manager`. `role: owner` and the owner's own row are BAD_USER_INPUT (handing
  # the household over is H6). A person not in the household is FORBIDDEN.
  # Location roles do not change, and open invites stay open (owner decision
  # O18-A). The same role again writes nothing.
  setHouseholdRole(userId: ID!, role: HouseholdRole!): HouseholdPerson!
  # The owner removes anyone but themself (BAD_USER_INPUT for themself). A
  # manager removes only a `member`. Anything else is FORBIDDEN, also a person
  # not in the household. The person's location roles in this household go
  # with them (decision T11). Their invites stay open (owner decision O18-A).
  removeMember(userId: ID!): Boolean!
  # A manager or member leaves the household they act in, with their location
  # roles there (decision T11). The owner cannot leave (BAD_USER_INPUT).
  leaveHousehold: Boolean!
  # Only for a person in NO household (owner decision O16-A); anyone else gets
  # BAD_USER_INPUT with extensions.reason ALREADY_IN_HOUSEHOLD. Makes a
  # household with the caller as owner and one location, "Home", the same as
  # first sign-in. The name is trimmed, and checked like `renameHousehold`'s.
  # With no name, the first sign-in name ("<name>'s Household").
  createHousehold(name: String): Household!
}
