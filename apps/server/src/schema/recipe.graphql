type RecipeItem {
  itemId: String!
  defaultAmount: Float!
}

input RecipeItemInput {
  itemId: String!
  defaultAmount: Float!
}

"""
One item a cook uses.

Since households H3b task B.6 the client sends only the amount used. It sends
no final stock numbers and no log total. The server reads the stock row at the
cook's location, takes the amount off with the shared `consumeItem` rule
(`@p1i/types`), and computes the log total itself. Before B.6 the client sent
`packedQuantity`, `unpackedQuantity` and `quantity`, computed from the stock it
had loaded, and the server wrote them as they were. Two people cooking the
same item from the same screen then wrote the same final numbers, and one use
was lost.
"""
input ConsumeRecipesItemInput {
  itemId: ID!

  """
  The signed change written to the inventory log: minus the amount used. It is
  the same number in local and cloud mode. The unit is the one `consumeItem`
  takes: measurement units when the item tracks in measurement, otherwise
  packages. It must be below 0; 0 or more is refused with `BAD_USER_INPUT`.

  The log keeps this full value even when the stock runs out and falls by
  less.
  """
  delta: Float!
  note: String
  logKey: String
  logParams: JSON
}

input ConsumeRecipesInput {
  occurredAt: String!
  recipeIds: [ID!]!
  items: [ConsumeRecipesItemInput!]!

  """
  The location the cook consumed from.

  Cooking takes stock out of ONE location. Before PR 3b Task 3 this input
  carried no location at all, so the server took it out of the caller's default
  location — a user cooking while viewing their Garage moved their Kitchen's
  stock and wrote the inventory log against the Kitchen.

  REQUIRED since PR 3b Task 4. It was nullable for two tasks, with a fallback
  to the caller's default location. That fallback is gone: an omitted argument
  writes the wrong location quietly, while a missing required argument fails
  loudly at codegen time — the hazard PR 3a recorded on `itemLogs`.
  """
  locationId: ID!
}

"""
Since households H3b task B.6 a cook runs in one transaction: every item is
written, or none is. A failure is a GraphQL error on the whole mutation, never
one entry here. So when a result comes back, every entry has `success: true`
and `error: null`, and `allSucceeded` is `true`. The shape is kept so the web
document did not have to change.
"""
type ConsumeRecipesItemResult {
  itemId: ID!
  success: Boolean!
  error: String
}

type ConsumeRecipesResult {
  itemResults: [ConsumeRecipesItemResult!]!
  allSucceeded: Boolean!
}

type Recipe {
  id: ID!
  name: String!
  items: [RecipeItem!]!
  lastCookedAt: String
}

extend type Query {
  recipes: [Recipe!]!
  recipe(id: ID!): Recipe
}

extend type Mutation {
  createRecipe(name: String!, items: [RecipeItemInput!]): Recipe!
  updateRecipe(id: ID!, name: String, items: [RecipeItemInput!]): Recipe!
  updateRecipeLastCookedAt(id: ID!): Recipe!
  deleteRecipe(id: ID!): Boolean!

  """
  Make `recipeIds` the exact set of recipes that hold this item. Recipes not
  in the list lose the item; recipes in the list that do not hold it get it,
  with `defaultAmount` = the item's `consumeAmount`, or 1 when that is 0. A
  recipe that already holds the item keeps its amount. One transaction.
  Returns the recipes that changed (empty when nothing changed).
  """
  setItemRecipes(itemId: ID!, recipeIds: [ID!]!): [Recipe!]!
  consumeRecipes(input: ConsumeRecipesInput!): ConsumeRecipesResult!
}
