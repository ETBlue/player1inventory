type Item {
  id: ID!
  name: String!
  tagIds: [String!]!
  vendorIds: [String!]
  packageUnit: String
  measurementUnit: String
  amountPerPackage: Float
  targetUnit: String!
  consumeAmount: Float!
  estimatedDueDays: Int
  expirationThreshold: Int
  expirationMode: String
  userId: String!
  createdAt: String!
  updatedAt: String!
}

extend type Query {
  items: [Item!]!
  item(id: ID!): Item
  itemCountByTag(tagId: String!): Int!
  itemCountByVendor(vendorId: String!): Int!
  itemCountByRecipe(recipeId: String!): Int!
}

extend type Mutation {
  createItem(input: CreateItemInput!): Item!
  updateItem(id: ID!, input: UpdateItemInput!): Item!
  deleteItem(id: ID!): Boolean!
}

input CreateItemInput {
  name: String!
  tagIds: [String!]
  vendorIds: [String!]
  targetUnit: String
  consumeAmount: Float
  packageUnit: String
  measurementUnit: String
  amountPerPackage: Float
  estimatedDueDays: Int
  expirationThreshold: Int
  expirationMode: String
}

input UpdateItemInput {
  name: String
  tagIds: [String!]
  vendorIds: [String!]
  targetUnit: String
  consumeAmount: Float
  packageUnit: String
  measurementUnit: String
  amountPerPackage: Float
  estimatedDueDays: Int
  expirationThreshold: Int
  expirationMode: String
}
