type InventoryLog {
  id: ID!
  itemId: ID!
  delta: Float!
  quantity: Float!
  occurredAt: String!
  note: String
  logKey: String
  logParams: JSON
}

type LastPurchaseDateResult {
  itemId: ID!
  date: String
}

extend type Query {
  """
  Logs for one item at one location, oldest first.

  `locationId` is nullable only until the web client passes it at every call
  site (PR 3a Task 4). When it is omitted the caller's default location is
  used. It must become `ID!` once no caller omits it: an omitted argument
  reads the wrong location quietly, while a missing required argument fails
  loudly at codegen time.
  """
  itemLogs(itemId: ID!, locationId: ID): [InventoryLog!]!

  "How many logs the item has at one location. Same nullability note as itemLogs."
  inventoryLogCountByItem(itemId: ID!, locationId: ID): Int!

  "Most recent positive-delta log date per item, at one location. Same nullability note as itemLogs."
  lastPurchaseDates(itemIds: [ID!]!, locationId: ID): [LastPurchaseDateResult!]!

  """
  Every log the caller owns, across every location.

  Whole-account on purpose — it is the snapshot path, not a screen. Its only
  two callers are apps/web/src/lib/exportData.ts (writes the backup file) and
  apps/web/src/lib/importData.ts (reads the current cloud state to detect
  conflicts). Both must see every location or the backup loses rows.
  """
  inventoryLogs: [InventoryLog!]!
}

extend type Mutation {
  """
  Write one log at one location.

  Same `locationId` nullability note as itemLogs. The caller needs the
  `member` role on the location, not `viewer`.
  """
  addInventoryLog(
    itemId: ID!
    delta: Float!
    quantity: Float!
    occurredAt: String!
    locationId: ID
    note: String
    logKey: String
    logParams: JSON
  ): InventoryLog!
}
