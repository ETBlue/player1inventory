# ── FILE: apps/server/src/schema/import.graphql ──

# Input types for bulk import mutations
#
# `ItemInput` is the global item CONFIGURATION only. The five per-location state
# fields — targetQuantity, refillThreshold, packedQuantity, unpackedQuantity,
# dueDate — are NOT here: cloud locations PR 5 dropped them from `Item`, and an
# imported payload's stock rows travel in `ItemStockImportInput` through
# `bulkCreateItemStocks` / `bulkUpsertItemStocks`, each row naming its location.
input ItemInput {
  id: ID!
  name: String!
  # Both optional, and both must be here or a cloud backup silently drops them
  # on restore (issue #335).
  wikidataUrl: String
  note: String
  tagIds: [String!]!
  vendorIds: [String!]
  packageUnit: String
  measurementUnit: String
  amountPerPackage: Float
  targetUnit: String!
  consumeAmount: Float!
  estimatedDueDays: Int
  expirationThreshold: Int
  expirationMode: String
  createdAt: String!
  updatedAt: String!
}

input TagInput {
  id: ID!
  name: String!
  typeId: String!
  parentId: String
}

input TagTypeInput {
  id: ID!
  name: String!
  color: String!
}

input VendorInput {
  id: ID!
  name: String!
}

input RecipeInput {
  id: ID!
  name: String!
  items: [RecipeItemInput!]!
  lastCookedAt: String
}

input InventoryLogInput {
  id: ID!
  itemId: ID!
  delta: Float!
  quantity: Float!
  occurredAt: String!
  note: String
  logKey: String
  logParams: JSON
  # OPTIONAL, not `ID!`, on purpose. A client built before cloud locations
  # sends no such field, and making it required would reject every import
  # that client issues. When it is absent the resolver falls back to the
  # caller's default location, which is what the field replaced.
  #
  # Attacker-controlled. The resolvers verify it through
  # `requireLocationRole(ctx, locationId, 'member')` before any row is
  # written — a log in someone else's location would be a cross-user write.
  locationId: ID
}

input ShoppingCartInput {
  id: ID!
  lastPurchasedAt: String
}

input CartItemInput {
  id: ID!
  cartId: ID!
  itemId: ID!
  quantity: Int!
}

input LocationInput {
  id: ID!
  name: String!
  order: Int!
  createdAt: String!
  updatedAt: String!
  # NO `isDefault` FIELD, ON PURPOSE. `bulkCreateLocations` always writes
  # `isDefault: false`, and `bulkUpsertLocations` never names the column at
  # all, so an existing row keeps whatever flag it has.
  #
  # Three reasons, and each one is enough on its own:
  #
  #  1. The payload's default location is never uploaded as a row. The client
  #     rewrites its id to the destination account's existing `isDefault` id
  #     (design §6, brainstorming decision 7), so only NON-default locations
  #     ever reach these mutations. A field only the remap could fill is a
  #     field nothing fills.
  #  2. `ensureDefaultLocation(userId)` (lib/defaultLocation.ts) already
  #     guarantees the account has exactly one default, so the server does not
  #     need the payload's opinion about which row that is.
  #  3. The database would REJECT a second default, not accept it. PR 1's
  #     migration adds `CREATE UNIQUE INDEX "Location_one_default_per_user_key"
  #     ON "Location" ("userId") WHERE "isDefault"`
  #     (20260830000000_add_location_and_item_stock/migration.sql:57). So
  #     honouring the flag would not corrupt the account — it would make the
  #     import DIE with an unhandled P2002, and under the "clear & import"
  #     strategy that happens AFTER `clearAllData` has run, leaving the account
  #     empty and the import dead.
  #
  # Note which way round point 3 is. The PR 4 design doc and the PR 4a plan both
  # SAID there is "no database constraint keeping it to one row per user". That
  # was wrong — the index exists — and both were corrected on 2026-10-02
  # (commit 9f5a7692). The decision is the same either way; only the failure it
  # prevents is different.
}

# One ItemStock row from a backup: the per-(item x location) stock STATE.
#
# WHY THIS IS A SECOND INPUT AND NOT `ItemStockInput` (schema/itemStock.graphql:78).
# The next reader will want to merge the two. They cannot be merged:
#
#  1. `ItemStockInput` is a PARTIAL-MERGE input. All five of its fields are
#     optional and a MISSING key means "leave that column alone" — see `toData`
#     in itemStock.resolver.ts. Import is a REPLACE: every column comes from
#     the payload, so every field here is required. One input cannot mean both.
#  2. `ItemStockInput` carries no identity at all. `upsertItemStock` takes
#     `itemId` and `locationId` as its own arguments; a bulk payload has to
#     carry `id`, `itemId` and `locationId` per row.
#  3. Widening `ItemStockInput` would change a THIRD contract.
#     `UnitSwitchStockConversionInput` (itemStock.graphql:51) embeds it as
#     `quantities`, so new required fields there would break `applyUnitSwitch`.
#  4. Renaming `ItemStockInput` to free the clean name is also out: input type
#     names appear in client operations
#     (`mutation UpsertItemStock($input: ItemStockInput!)`), so a rename breaks
#     a cached bundle still running the old document.
#
# NO `userId` FIELD, and the resolvers write none. `ItemStock` has no `userId`
# COLUMN, on purpose: it is scoped THROUGH its location (root CLAUDE.md,
# Authorization). The field list below is every column of the Prisma model
# (schema.prisma:267-284) and every field of the local `ItemStock` interface
# (packages/types/src/index.ts:47), with nothing added and nothing dropped.
input ItemStockImportInput {
  id: ID!
  itemId: ID!
  locationId: ID!
  targetQuantity: Float!
  refillThreshold: Float!
  packedQuantity: Float!
  unpackedQuantity: Float!
  dueDate: String
  createdAt: String!
  updatedAt: String!
}

input ShelfInput {
  id: ID!
  name: String!
  type: String!
  order: Int!
  filterConfig: FilterConfigInput
  itemIds: [String!]
  createdAt: String!
  updatedAt: String!
}

extend type Mutation {
  # Bulk create mutations — used for "skip conflicts" strategy
  bulkCreateItems(items: [ItemInput!]!): [Item!]!
  bulkCreateTags(tags: [TagInput!]!): [Tag!]!
  bulkCreateTagTypes(tagTypes: [TagTypeInput!]!): [TagType!]!
  bulkCreateVendors(vendors: [VendorInput!]!): [Vendor!]!
  bulkCreateRecipes(recipes: [RecipeInput!]!): [Recipe!]!
  bulkCreateInventoryLogs(logs: [InventoryLogInput!]!): [InventoryLog!]!
  bulkCreateShoppingCarts(carts: [ShoppingCartInput!]!): [Cart!]!
  bulkCreateCartItems(cartItems: [CartItemInput!]!): [CartItem!]!
  bulkCreateShelves(shelves: [ShelfInput!]!): [Shelf!]!
  bulkCreateLocations(locations: [LocationInput!]!): [Location!]!
  bulkCreateItemStocks(itemStocks: [ItemStockImportInput!]!): [ItemStock!]!

  # Bulk upsert mutations — used for "replace conflicts" strategy (upserts by entity id)
  bulkUpsertItems(items: [ItemInput!]!): [Item!]!
  bulkUpsertTags(tags: [TagInput!]!): [Tag!]!
  bulkUpsertTagTypes(tagTypes: [TagTypeInput!]!): [TagType!]!
  bulkUpsertVendors(vendors: [VendorInput!]!): [Vendor!]!
  bulkUpsertRecipes(recipes: [RecipeInput!]!): [Recipe!]!
  bulkUpsertInventoryLogs(logs: [InventoryLogInput!]!): [InventoryLog!]!
  bulkUpsertShoppingCarts(carts: [ShoppingCartInput!]!): [Cart!]!
  bulkUpsertCartItems(cartItems: [CartItemInput!]!): [CartItem!]!
  bulkUpsertShelves(shelves: [ShelfInput!]!): [Shelf!]!
  bulkUpsertLocations(locations: [LocationInput!]!): [Location!]!
  bulkUpsertItemStocks(itemStocks: [ItemStockImportInput!]!): [ItemStock!]!

  # Clear all data — used for "clear & import" strategy
  clearAllData: Boolean!
}

# ── FILE: apps/server/src/schema/cart.graphql ──

"""
A shopping cart, one per (location, vendor).

Since PR 3b the id is `${locationId}:${vendorId | 'no-vendor'}`, the same shape
local mode uses (`cartIdFor` in packages/types/src/index.ts). The id is a
cross-mode wire contract — backups round-trip by id — so it is denormalized on
purpose alongside the `locationId` column the server queries by.
"""
type Cart {
  id: ID!
  lastPurchasedAt: String
}

type CartItem {
  id: ID!
  cartId: ID!
  itemId: ID!
  quantity: Int!
}

"""
One bought item, with the on-hand total the CLIENT computed for its log row.

── WHY THE CLIENT OWNS THIS NUMBER ──

The log's `quantity` is the item's on-hand total in PACKAGE units after the
purchase. Turning the unpacked remainder into a fraction of a pack needs
`amountPerPackage`, which is a global field on `Item`, not on `ItemStock`. The
resolver holds only the `ItemStock` row that `writeStock` returned, so it
cannot do the conversion.

It used to add the two columns raw — `stock.packedQuantity +
stock.unpackedQuantity` — while local mode ran `getPackedTotal(...)` instead
(apps/web/src/lib/quantityUtils.ts). The two answers differ whenever an item
has an `amountPerPackage` AND a non-zero `unpackedQuantity`: with
`amountPerPackage` 6, 2 packed and 3 unpacked, local logs 2.5 and cloud logged
5. That is issue #336.

`consumeRecipes` set this precedent: `ConsumeRecipesItemInput` already carries
a client-computed `quantity` for the same reason (src/schema/recipe.graphql).

── WHAT `quantity` MUST BE ──

The POST-purchase total, already converted:

    getPackedTotal({ packedQuantity, unpackedQuantity, amountPerPackage })
      + cartItem.quantity

Read `packedQuantity` and `unpackedQuantity` from the PRE-purchase stock row.
The cart quantity is added AFTER the conversion, because the cart quantity is
already counted in packs and must not be divided by `amountPerPackage`.

Send one entry for every cart item with `quantity > 0` — the same rule the
resolver's `buyingItems` filter uses. A bought item with no entry here fails
the whole checkout with `BAD_USER_INPUT`; there is no fallback.
"""
input CheckoutItemInput {
  itemId: ID!
  quantity: Float!
}

extend type Query {
  """
  The permanent cart for one vendor at one location, created if it is missing.

  `locationId` is REQUIRED (PR 3b Task 4). It was nullable for two tasks, with
  a fallback to the caller's default location, and that fallback is gone: an
  omitted argument read the wrong location quietly, while a missing required
  argument fails loudly at codegen time. That is the hazard PR 3a recorded on
  `itemLogs`.

  `vendorId` stays nullable — `null` names the no-vendor cart, which is a real
  cart, not a missing argument.
  """
  vendorCart(vendorId: ID, locationId: ID!): Cart!

  """
  Every cart the caller owns, across every location.

  Whole-account on purpose, like `inventoryLogs`. The shopping page shows each
  vendor's "last purchased" and the export path needs every location's carts or
  the backup loses rows. Each row's location is recoverable from its id.
  """
  allCarts: [Cart!]!

  "Items in one cart. The cart id names the location, and the caller needs the `viewer` role on it."
  cartItems(cartId: ID!): [CartItem!]!

  """
  How many carts hold this item.

  With no `locationId`, the count covers every location and answers "is this
  item in any cart". With one, it counts only that location's carts — the
  number the Stock tab's "remove from location" confirmation shows, so it must
  match exactly what `removeItemFromLocation` deletes. The caller needs the
  `viewer` role on the named location.
  """
  cartItemCountByItem(itemId: ID!, locationId: ID): Int!

  "Every cart item the caller owns, across every location. The snapshot path, not a screen."
  allCartItems: [CartItem!]!
}

extend type Mutation {
  "Add an item to a cart. The cart id names the location, and the caller needs the `member` role on it."
  addToCart(cartId: ID!, itemId: ID!, quantity: Int!): CartItem!

  "Change one cart item's quantity. `id` is a CartItem id; its location comes from the row's own cartId."
  updateCartItem(id: ID!, quantity: Int!): CartItem!

  "Delete one cart item. `id` is a CartItem id; its location comes from the row's own cartId."
  removeFromCart(id: ID!): Boolean!

  """
  Buy everything in the cart with a quantity above zero.

  The cart id names the location, is authorized against it, and — since PR 3b
  Task 3 — is the location the stock move and the inventory log are written to.
  Both used to go to the caller's DEFAULT location, so a checkout made while
  viewing the Garage credited the Kitchen.

  `items` carries the on-hand total each log row records, computed by the
  client. It is REQUIRED and has no fallback — see `CheckoutItemInput` above
  for why the client owns that number, and what breaks for an old client.
  """
  checkout(
    cartId: ID!
    items: [CheckoutItemInput!]!
    note: String
    logKey: String
    logParams: JSON
  ): Cart!

  "Empty one cart, pinned items included. The cart id names the location."
  abandonCart(cartId: ID!): Cart!

  """
  Make sure one location has its no-vendor cart and one cart per vendor, then
  return every cart at that location.

  The cloud half of local mode's `bootstrapCarts`
  (apps/web/src/db/operations.ts). `createVendor` pre-creates a cart at ONE
  location — the one the caller was looking at — so every other location is
  missing that vendor's cart until something fills it in. This mutation is that
  something.

  ── WHY A MUTATION, AND NOT THE `locations` QUERY ──

  1. Local mode says so. The comment on `createVendor` in
     apps/web/src/db/operations.ts states that carts are pre-created up front
     and NOT lazily from a read path, which is what keeps `getCart` a pure read.
     Putting the creation inside `locations` would make a read write.
  2. `locations` does not know which location the caller is looking at, so it
     would have to create `locations x vendors` carts on every call. This
     mutation creates one location's worth, when that location becomes active.
  3. Authorization fits. One caller-supplied `locationId` goes through
     `requireLocationRole(locationId, 'member')`, the same seam every other
     location write uses. A read path would have to demand `member` on every
     location just to list them.

  `locationId` was required from the start, and there is no default-location
  fallback here. `vendorCart` and `createVendor` took theirs in Task 4.

  The caller is the web client's active-location effect: local mode calls
  `bootstrapCarts(activeLocationId)` from `ActiveLocationProvider`
  (apps/web/src/hooks/useActiveLocation.tsx) whenever the active location
  changes, and since Task 4 the cloud branch of that same effect calls this
  mutation.
  """
  bootstrapCarts(locationId: ID!): [Cart!]!
}

# ── FILE: apps/server/src/schema/inventoryLog.graphql ──

type InventoryLog {
  id: ID!
  itemId: ID!

  """
  The location the log was written against.

  `ID!` and not `ID`. The Prisma column is NOT NULL (`schema.prisma:205`) and
  carries a FK to `Location`. PR 3a's migration
  (`20260916000000_add_location_to_log_and_cart`) added it nullable, backfilled
  it from each owner's default location, raised an exception if any row was
  still NULL, and only then ran `SET NOT NULL`. No later migration touches the
  column. Every resolver that returns an `InventoryLog` returns the whole
  Prisma row with no `select`, so no path can hand GraphQL a row without this
  field.

  Exposed by PR 4a for cloud export: a backup has to record which location
  each log belongs to, or restoring it puts every log in one place.
  """
  locationId: ID!

  delta: Float!
  quantity: Float!
  occurredAt: String!
  note: String
  logKey: String
  logParams: JSON
}

type LastPurchaseDateResult {
  itemId: ID!
  date: String
}

extend type Query {
  """
  Logs for one item at one location, oldest first.

  `locationId` is REQUIRED. It was nullable with a server-side default-location
  fallback for one commit, while PR 3a Task 2 landed ahead of its client; Task 4
  passed it at every call site and tightened it here. Do not make it nullable
  again: an omitted argument reads the wrong location quietly, while a missing
  required argument fails loudly at codegen time.
  """
  itemLogs(itemId: ID!, locationId: ID!): [InventoryLog!]!

  "How many logs the item has at one location. `locationId` is required — same note as itemLogs."
  inventoryLogCountByItem(itemId: ID!, locationId: ID!): Int!

  "Most recent positive-delta log date per item, at one location. `locationId` is required — same note as itemLogs."
  lastPurchaseDates(itemIds: [ID!]!, locationId: ID!): [LastPurchaseDateResult!]!

  """
  Every log the caller owns, across every location.

  Whole-account on purpose — it is the snapshot path, not a screen. Its only
  two callers are apps/web/src/lib/exportData.ts (writes the backup file) and
  apps/web/src/lib/importData.ts (reads the current cloud state to detect
  conflicts). Both must see every location or the backup loses rows.
  """
  inventoryLogs: [InventoryLog!]!
}

extend type Mutation {
  """
  Write one log at one location.

  `locationId` is required — same note as itemLogs. The caller needs the
  `member` role on the location, not `viewer`.
  """
  addInventoryLog(
    itemId: ID!
    delta: Float!
    quantity: Float!
    occurredAt: String!
    locationId: ID!
    note: String
    logKey: String
    logParams: JSON
  ): InventoryLog!
}

