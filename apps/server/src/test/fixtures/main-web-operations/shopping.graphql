# OLD-BUNDLE FIXTURE. Do not edit by hand. Delete with the shim fields.
#
# A copy of `apps/web/src/apollo/operations/shopping.graphql` from `origin/main` at 351d22ad, taken 2026-11-17.
# That is the web bundle in production before the households release.
# `src/test/oldBundleCompat.test.ts` checks that the current server schema
# still accepts it, so the server can be deployed before the web.
# Delete this folder in the release after households, together with the
# deprecated shim fields (see that test file).

query VendorCart($vendorId: ID, $locationId: ID!) {
  vendorCart(vendorId: $vendorId, locationId: $locationId) {
    id
    lastPurchasedAt
  }
}

query AllCarts {
  allCarts {
    id
    lastPurchasedAt
  }
}

query CartItems($cartId: ID!) {
  cartItems(cartId: $cartId) {
    id
    cartId
    itemId
    quantity
  }
}

query AllCartItems {
  allCartItems {
    id
    cartId
    itemId
    quantity
  }
}

query CartItemCountByItem($itemId: ID!, $locationId: ID) {
  cartItemCountByItem(itemId: $itemId, locationId: $locationId)
}

mutation AddToCart($cartId: ID!, $itemId: ID!, $quantity: Int!) {
  addToCart(cartId: $cartId, itemId: $itemId, quantity: $quantity) {
    id
    cartId
    itemId
    quantity
  }
}

mutation UpdateCartItem($id: ID!, $quantity: Int!) {
  updateCartItem(id: $id, quantity: $quantity) {
    id
    cartId
    itemId
    quantity
  }
}

mutation RemoveFromCart($id: ID!) {
  removeFromCart(id: $id)
}

# `items` carries the on-hand total each log row records, computed here because
# `amountPerPackage` is a global `Item` field the resolver cannot see. See the
# doc string on `CheckoutItemInput` in apps/server/src/schema/cart.graphql.
mutation Checkout(
  $cartId: ID!
  $items: [CheckoutItemInput!]!
  $note: String
  $logKey: String
  $logParams: JSON
) {
  checkout(
    cartId: $cartId
    items: $items
    note: $note
    logKey: $logKey
    logParams: $logParams
  ) {
    id
    lastPurchasedAt
  }
}

mutation AbandonCart($cartId: ID!) {
  abandonCart(cartId: $cartId) {
    id
  }
}

# The cloud half of local mode's `bootstrapCarts` (src/db/operations.ts).
# `ActiveLocationProvider` calls it whenever the active location changes, so
# every vendor has a cart at the location the user just switched to.
mutation BootstrapCarts($locationId: ID!) {
  bootstrapCarts(locationId: $locationId) {
    id
    lastPurchasedAt
  }
}
