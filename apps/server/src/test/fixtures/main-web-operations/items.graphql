#
# A copy of `apps/web/src/apollo/operations/items.graphql` from `origin/main` at 351d22ad, taken 2026-11-17.
# That is the web bundle in production before the households release.
# `src/test/oldBundleCompat.test.ts` checks that the current server schema
# still accepts it, so the server can be deployed before the web.
# Delete this folder in the release after households, together with the
# deprecated shim fields (see that test file).

query GetItem($id: ID!) {
  item(id: $id) {
    id
    name
    wikidataUrl
    note
    tagIds
    vendorIds
    packageUnit
    measurementUnit
    amountPerPackage
    targetUnit
    consumeAmount
    expirationMode
    estimatedDueDays
    expirationThreshold
    createdAt
    updatedAt
  }
}

query GetItems {
  items {
    id
    name
    wikidataUrl
    note
    tagIds
    vendorIds
    packageUnit
    measurementUnit
    amountPerPackage
    targetUnit
    consumeAmount
    expirationMode
    estimatedDueDays
    expirationThreshold
    createdAt
    updatedAt
  }
}

# `wikidataUrl` and `note` are absent here on purpose, unlike in `GetItem`,
# `GetItems` and `UpdateItem`. `toCreateItemInput` (hooks/useItems.ts) never
# sends them, because no create call site supplies them — the two fields are
# only ever typed on the Info tab of an item that already exists. So the
# response could only carry null for both, and the dialog navigates to the Info
# tab, whose `GetItem` runs on `cache-and-network` and reads them anyway.
mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    id
    name
    tagIds
    targetUnit
    consumeAmount
    expirationMode
    estimatedDueDays
    expirationThreshold
    createdAt
    updatedAt
  }
}

mutation UpdateItem($id: ID!, $input: UpdateItemInput!) {
  updateItem(id: $id, input: $input) {
    id
    name
    wikidataUrl
    note
    tagIds
    vendorIds
    packageUnit
    measurementUnit
    amountPerPackage
    targetUnit
    consumeAmount
    expirationMode
    estimatedDueDays
    expirationThreshold
    updatedAt
  }
}

mutation DeleteItem($id: ID!) {
  deleteItem(id: $id)
}

query ItemCountByTag($tagId: String!) {
  itemCountByTag(tagId: $tagId)
}

query ItemCountByVendor($vendorId: String!) {
  itemCountByVendor(vendorId: $vendorId)
}

query ItemCountByRecipe($recipeId: String!) {
  itemCountByRecipe(recipeId: $recipeId)
}
