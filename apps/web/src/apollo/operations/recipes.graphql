query GetRecipes {
  recipes {
    id
    name
    items {
      itemId
      defaultAmount
    }
    lastCookedAt
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    id
    name
    items {
      itemId
      defaultAmount
    }
    lastCookedAt
  }
}

mutation CreateRecipe($name: String!, $items: [RecipeItemInput!]) {
  createRecipe(name: $name, items: $items) {
    id
    name
    items {
      itemId
      defaultAmount
    }
  }
}

mutation UpdateRecipe($id: ID!, $name: String, $items: [RecipeItemInput!]) {
  updateRecipe(id: $id, name: $name, items: $items) {
    id
    name
    items {
      itemId
      defaultAmount
    }
  }
}

# The item Recipes tab's Save: make `recipeIds` the exact set of recipes
# that hold the item, in one transaction. Answers the recipes that changed
# (empty when nothing changed). The same fields as `GetRecipes`, so the
# answer's rows land in the cache under the same ids.
mutation SetItemRecipes($itemId: ID!, $recipeIds: [ID!]!) {
  setItemRecipes(itemId: $itemId, recipeIds: $recipeIds) {
    id
    name
    lastCookedAt
    items {
      itemId
      defaultAmount
    }
  }
}

mutation UpdateRecipeLastCookedAt($id: ID!) {
  updateRecipeLastCookedAt(id: $id) {
    id
    lastCookedAt
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id)
}

mutation ConsumeRecipes($input: ConsumeRecipesInput!) {
  consumeRecipes(input: $input) {
    itemResults {
      itemId
      success
      error
    }
    allSucceeded
  }
}
