query GetVendors {
  vendors {
    id
    name
  }
}

mutation CreateVendor($name: String!, $locationId: ID!) {
  createVendor(name: $name, locationId: $locationId) {
    id
    name
  }
}

mutation UpdateVendor($id: ID!, $name: String) {
  updateVendor(id: $id, name: $name) {
    id
    name
  }
}

mutation DeleteVendor($id: ID!) {
  deleteVendor(id: $id)
}
