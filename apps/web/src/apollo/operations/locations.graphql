query GetLocations {
  locations {
    id
    name
    order
    createdAt
    updatedAt
  }
}

mutation CreateLocation($name: String!) {
  createLocation(name: $name) {
    id
    name
    order
    createdAt
    updatedAt
  }
}

mutation UpdateLocation($id: ID!, $input: UpdateLocationInput!) {
  updateLocation(id: $id, input: $input) {
    id
    name
    order
    createdAt
    updatedAt
  }
}

mutation DeleteLocation($id: ID!) {
  deleteLocation(id: $id)
}

mutation ReorderLocations($orderedIds: [ID!]!) {
  reorderLocations(orderedIds: $orderedIds) {
    id
    name
    order
    createdAt
    updatedAt
  }
}
