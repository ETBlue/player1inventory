# The pantry's single request: the item catalog plus the active location's stock
# rows, joined on the client by `joinItemStock` (`lib/itemStock.ts`) — the same
# function local mode calls. The `items` selection set is identical to
# `GetItems` (`items.graphql`) so both operations agree in the normalized cache.
query PantryData($locationId: ID!) {
  items {
    id
    name
    wikidataUrl
    note
    tagIds
    vendorIds
    packageUnit
    measurementUnit
    amountPerPackage
    targetUnit
    consumeAmount
    consumable
    expirationMode
    estimatedDueDays
    expirationThreshold
    createdAt
    updatedAt
  }
  itemStocks(locationId: $locationId) {
    id
    itemId
    locationId
    targetQuantity
    refillThreshold
    packedQuantity
    unpackedQuantity
    dueDate
    isActive
    createdAt
    updatedAt
  }
}

# Every location's row for one item — the Stock-tab all-locations pager.
query ItemStocksForItem($itemId: ID!) {
  itemStocksForItem(itemId: $itemId) {
    id
    itemId
    locationId
    targetQuantity
    refillThreshold
    packedQuantity
    unpackedQuantity
    dueDate
    isActive
    createdAt
    updatedAt
  }
}

mutation UpsertItemStock($itemId: ID!, $locationId: ID!, $input: ItemStockInput!) {
  upsertItemStock(itemId: $itemId, locationId: $locationId, input: $input) {
    id
    itemId
    locationId
    targetQuantity
    refillThreshold
    packedQuantity
    unpackedQuantity
    dueDate
    isActive
    createdAt
    updatedAt
  }
}

mutation AddItemToLocation($itemId: ID!, $locationId: ID!, $sourceLocationId: ID) {
  addItemToLocation(itemId: $itemId, locationId: $locationId, sourceLocationId: $sourceLocationId) {
    id
    itemId
    locationId
    targetQuantity
    refillThreshold
    packedQuantity
    unpackedQuantity
    dueDate
    isActive
    createdAt
    updatedAt
  }
}

mutation RemoveItemFromLocation($itemId: ID!, $locationId: ID!) {
  removeItemFromLocation(itemId: $itemId, locationId: $locationId)
}

# One transactional unit switch — the Item's configuration, every location's
# converted quantities, and every recipe amount expressed in the old unit. The
# cloud counterpart of local's `applyUnitSwitchBatch` (db/operations.ts).
#
# The selection set matches `UpdateItem`'s so both operations agree in the
# normalized cache.
mutation ApplyUnitSwitch($input: ApplyUnitSwitchInput!) {
  applyUnitSwitch(input: $input) {
    id
    name
    wikidataUrl
    note
    tagIds
    vendorIds
    packageUnit
    measurementUnit
    amountPerPackage
    targetUnit
    consumeAmount
    consumable
    expirationMode
    estimatedDueDays
    expirationThreshold
    updatedAt
  }
}

# Is one location empty? Only the ids of its stock rows. Read once, by
# `importCloudData` after a `skip` or `replace` import, to decide whether to
# show the backup's first location instead of an empty active one (households
# H4, owner decision of 2026-11-17, option B). No component watches it, so it
# is not in `QUERIES_BY_KIND` (apollo/liveUpdates.ts).
query ItemStockIdsAtLocation($locationId: ID!) {
  itemStocks(locationId: $locationId) {
    id
  }
}
